<!doctype html>
<html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:transparent;overflow:hidden;}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:flex;justify-content:center;}
  #pill{
    position:relative;width:100%;max-width:220px;border-radius:22px;
    background:rgba(10,10,14,.94);border:1px solid rgba(255,255,255,.13);
    color:#fff;padding:8px 13px 9px;overflow:hidden;
    animation:breathe 3.2s ease-in-out infinite alternate;
  }
  @keyframes breathe{from{opacity:1}to{opacity:.9}}
  @keyframes glowBreath{from{opacity:.4}to{opacity:1}}
  #glow{position:absolute;inset:-1px;border-radius:23px;pointer-events:none;opacity:.85;
    animation:glowBreath 3.2s ease-in-out infinite alternate, spin 6.5s linear infinite;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.02) 40deg,var(--rim,rgba(124,200,255,.55)) 120deg,rgba(255,255,255,.02) 200deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .row{display:flex;align-items:center;gap:8px;position:relative;z-index:2}
  .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:-.01em}
  .pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .bar{height:2.5px;border-radius:2px;background:rgba(255,255,255,.16);margin-top:7px;overflow:hidden;position:relative;z-index:2}
  .bar>i{display:block;height:100%;width:0;border-radius:2px;background:#fff;transition:width .42s cubic-bezier(.2,.7,.3,1)}
  .detail{display:none;margin-top:8px;position:relative;z-index:2}
  .detail.on{display:block;animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .status{font-size:11px;color:rgba(255,255,255,.78)}
  .stats{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;font-variant-numeric:tabular-nums}
  .thought{font-size:11px;color:rgba(255,255,255,.62);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 参考项目的 BotMark（canvas 逐帧画的机器人）就挂在这里 */
  .avatar{width:22px;height:22px;flex:0 0 auto;display:block;position:relative;z-index:2}
  .avatar canvas{display:block;width:22px !important;height:22px !important}
</style></head>
<body>
<div id="pill">
  <div id="glow"></div>
  <div class="row">
    <div class="avatar" id="bot"></div>
    <div class="title" id="title">编导台</div>
    <div class="pct" id="pct">0%</div>
  </div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="detail" id="detail">
    <div class="status" id="status">待命中</div>
    <div class="stats" id="stats">用时 0s · 字数 0 · 额度 ≈0</div>
    <div class="thought" id="thought">正在整理思路…</div>
  </div>
</div>
<script>window.__ISLAND_ASSET_BASE__ = '.';</script>
<script src="bot.js"></script>
<script>
(function(){
  var el = {
    pill: document.getElementById('pill'),
    glow: document.getElementById('glow'),
    bot: document.getElementById('bot'),
    title: document.getElementById('title'),
    pct: document.getElementById('pct'),
    bar: document.getElementById('barfill'),
    detail: document.getElementById('detail'),
    status: document.getElementById('status'),
    stats: document.getElementById('stats'),
    thought: document.getElementById('thought')
  };

  // 外圈光边配色（机器人本体配色由 BotMark 自己按 source 的 logo 决定）
  var RIM = {
    deepseek: 'rgba(124,200,255,.55)',
    openai:   'rgba(80,220,170,.5)',
    claude:   'rgba(240,150,110,.5)',
    glm:      'rgba(150,130,255,.5)',
    kimi:     'rgba(90,180,255,.5)',
    qwen:     'rgba(160,120,255,.5)',
    ark:      'rgba(90,150,255,.5)',
    grok:     'rgba(200,200,200,.4)',
    copilot:  'rgba(90,200,255,.5)',
    cursor:   'rgba(220,220,220,.4)'
  };

  // 编导台的模型名 -> 参考项目的 agent key
  function brandKey(m){
    m = (m||'').toLowerCase();
    if(!m || m.indexOf('deepseek')>=0) return 'deepseek';
    if(m.indexOf('gpt')>=0||m.indexOf('openai')>=0||/^o[13]/.test(m)||m.indexOf('chatgpt')>=0) return 'openai';
    if(m.indexOf('claude')>=0||m.indexOf('anthropic')>=0) return 'claude';
    if(m.indexOf('glm')>=0||m.indexOf('智谱')>=0) return 'glm';
    if(m.indexOf('kimi')>=0||m.indexOf('moonshot')>=0) return 'kimi';
    if(m.indexOf('qwen')>=0||m.indexOf('通义')>=0) return 'qwen';
    if(m.indexOf('ep-')>=0||m.indexOf('doubao')>=0||m.indexOf('豆包')>=0) return 'ark';
    if(m.indexOf('grok')>=0) return 'grok';
    if(m.indexOf('copilot')>=0) return 'copilot';
    if(m.indexOf('cursor')>=0) return 'cursor';
    return 'deepseek';
  }
  function mmss(s){ return s<60 ? s+'s' : Math.floor(s/60)+'m'+(s%60)+'s'; }

  var lastSource = '', lastPhase = '';
  function paintBot(source, working){
    var phase = working ? 'working' : 'idle';
    if (source === lastSource && phase === lastPhase) return;
    lastSource = source; lastPhase = phase;
    el.pill.style.setProperty('--rim', RIM[source] || RIM.deepseek);
    if (window.__islandBot) window.__islandBot.set({ source: source, phase: phase });
  }
  paintBot('deepseek', false);

  window.island = {
    update: function(st){
      st = st || {};
      el.title.textContent = st.title || '编导台';
      var pct = Math.max(0, Math.min(100, Math.round(st.percent||0)));
      el.pct.textContent = pct + '%';
      el.bar.style.width = pct + '%';
      el.status.textContent = st.status || '待命中';
      el.stats.textContent = '用时 ' + mmss(st.elapsed||0) + ' · 字数 ' + (st.words||0) + ' · 额度 ≈' + Math.round((st.words||0)*1.6);
      el.thought.textContent = st.thought || '正在整理思路…';
      var working = st.working === true;
      paintBot(brandKey(st.model), working);
      el.pill.style.animationDuration = working ? '1.8s' : '3.2s';
    },
    setExpanded: function(on){
      el.detail.classList.toggle('on', !!on);
    },
    tap: function(){
      if (window.AndroidBridge && window.AndroidBridge.tap) window.AndroidBridge.tap();
    }
  };
  document.getElementById('pill').addEventListener('click', function(){ window.island.tap(); });

  // 兜底：BotMark 万一没挂上（脚本报错/资源缺失），退回静态 logo，别留个空位
  setTimeout(function(){
    try {
      if (!el.bot.querySelector('canvas')) {
        el.bot.innerHTML = '<img src="assets/deepseek.png" style="width:22px;height:22px;border-radius:50%;display:block">';
      }
    } catch (e) {}
  }, 1500);
})();
</script>
</body></html>
